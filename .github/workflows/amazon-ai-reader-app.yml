# amazon-ai-reader-app をビルドし、APKを「amazon-ai-reader-latest」リリースに置く。
# スマホからはリリースページを開いて APK をダウンロードするだけでインストールできる。
name: Amazon AI Reader app

on:
  push:
    paths:
      - "amazon-ai-reader-app/**"
      - ".github/workflows/amazon-ai-reader-app.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: amazon-ai-reader-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: amazon-ai-reader-app
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk amazon-ai-reader.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: amazon-ai-reader-apk
          path: amazon-ai-reader-app/amazon-ai-reader.apk

      - name: Publish to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete amazon-ai-reader-latest --yes --cleanup-tag || true
          gh release create amazon-ai-reader-latest amazon-ai-reader.apk \
            --target "${{ github.sha }}" --prerelease \
            --title "Amazon AI Reader (最新ビルド)" \
            --notes "ブランチ ${{ github.ref_name }} の最新ビルドです。amazon-ai-reader.apk をダウンロードしてインストールしてください。"

  # ビルドしたAPKをエミュレーターで起動し、スクリーンショットとログを「amazon-ai-reader-check」リリースに置く
  device-check:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/download-artifact@v4
        with:
          name: amazon-ai-reader-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash amazon-ai-reader-app/tools/device-check.sh amazon-ai-reader.apk

      - name: Publish results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete amazon-ai-reader-check --yes --cleanup-tag || true
          gh release create amazon-ai-reader-check out/* --target "${{ github.sha }}" --prerelease \
            --title "Amazon AI Reader 動作確認結果" --notes "エミュレーターでの起動確認（スクリーンショットとログ）"
