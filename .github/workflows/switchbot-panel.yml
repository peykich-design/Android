# switchbot-panel（ソファ操作パネル）をビルド・単体テストし、APKを「sofa-panel-latest」リリースに置く。
# スマホからはリリースページを開いて APK をダウンロードするだけでインストールできる。
name: SwitchBot sofa panel app

on:
  push:
    paths:
      - "switchbot-panel/**"
      - ".github/workflows/switchbot-panel.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: switchbot-panel
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: switchbot-panel
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug testDebugUnitTest --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk sofa-panel.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sofa-panel-apk
          path: switchbot-panel/sofa-panel.apk

      - name: Publish to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete sofa-panel-latest --yes --cleanup-tag || true
          gh release create sofa-panel-latest sofa-panel.apk \
            --target "${{ github.sha }}" --prerelease \
            --title "ソファパネル (最新ビルド)" \
            --notes "ブランチ ${{ github.ref_name }} の最新ビルドです。sofa-panel.apk をダウンロードしてインストールしてください。"
