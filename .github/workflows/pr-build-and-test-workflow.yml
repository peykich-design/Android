# Builds the app and runs unit tests on pull requests.
name: Build and test

on:
  pull_request:
    branches: [ "master" ]
    paths:
      - "android-template/**"
      - ".github/workflows/pr-build-and-test-workflow.yml"
    types: [ "opened", "reopened", "synchronize", "ready_for_review" ]

jobs:
  build:
    # Run this job only if the pull request is not a draft
    if: github.event.pull_request.draft == false
    name: Build app and execute unit tests on PR
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-template

    steps:
      - uses: actions/checkout@v4.2.2
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle # Enables Gradle caching for faster builds

      - name: Print project directory content
        run: |
          echo "Current directory is: ${GITHUB_WORKSPACE}"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant permission to Gradle
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew test

      # Upload test reports only if the test step fails
      - name: Archive test reports
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: |
            android-template/**/build/reports/
