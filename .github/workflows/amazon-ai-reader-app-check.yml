# 配布中のAPKをエミュレーターで起動して、画面とログを確認する（手動実行）
name: Amazon AI Reader device check

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Download APK
        run: curl -sL -o app.apk https://github.com/${{ github.repository }}/releases/download/amazon-ai-reader-latest/amazon-ai-reader.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash amazon-ai-reader-app/tools/device-check.sh

      - name: Publish results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete amazon-ai-reader-check --yes --cleanup-tag || true
          gh release create amazon-ai-reader-check out/* --target "${{ github.sha }}" --prerelease \
            --title "Amazon AI Reader 動作確認結果" --notes "エミュレーターでの起動確認（スクリーンショットとログ）"
